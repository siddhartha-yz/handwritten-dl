[project]
name = "handwritten-dl"
version = "0.1.0"
description = "Handwritten implementations of deep learning modules, written while studying their source."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy",
    "pandas",
    "torch",
    "torchvision",
    "ipython",
    "d2l",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
